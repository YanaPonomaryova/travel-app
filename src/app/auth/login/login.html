<div class="auth-container">
  <h2>Увійти</h2>

  <input
    type="email"
    name="email"
    placeholder="Email"
    [(ngModel)]="email"
  />

  <input
    type="password"
    name="password"
    placeholder="Пароль"
    [(ngModel)]="password"
  />

  <button (click)="login()">Увійти</button>

  <p>Немає акаунта?
    <a routerLink="/register">Зареєструватися</a>
  </p>
</div>
